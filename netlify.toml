[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Rapport hebdomadaire de l'espace coach : chaque lundi à 6 h UTC (8 h à Paris en été, 7 h en hiver)
[functions."rapport-hebdo"]
  schedule = "0 6 * * 1"

[[redirects]]
  from = "http://gacoachs.fr/*"
  to = "https://gacoachs.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.gacoachs.fr/*"
  to = "https://gacoachs.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.gacoachs.fr/*"
  to = "https://gacoachs.fr/:splat"
  status = 301
  force = true

